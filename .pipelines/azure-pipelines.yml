name: EdgeBrowsingPower_Release_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr: none

resources:
  repositories:
    - repository: self
      type: github
      endpoint: github.com_tdtsai1973   # ✅ YOUR SERVICE CONNECTION
      name: microsoft/WebBrowsingPowerRelease
      ref: refs/heads/main

variables:
  CONFIGURATION: Release
  RUNTIME_IDENTIFIER: win-x64
  PUBLISH_DIR: artifacts\EdgeBrowsingPower\win-x64
  INSTALLER_DIR: artifacts\EdgeBrowsingPower\installer

  ENABLE_PRS_DELAYSIGN: 1

pool:
  vmImage: windows-latest

steps:

# ------------------------------------------------------------
# 1. Checkout
# ------------------------------------------------------------
- checkout: self
  fetchDepth: 1

# ------------------------------------------------------------
# 2. Get version + tag
# ------------------------------------------------------------
- task: PowerShell@2
  name: setVersion
  displayName: Detect version and tag
  inputs:
    targetType: inline
    pwsh: true
    script: |
      $proj = "src/EdgeBrowsingPower/EdgeBrowsingPower.csproj"
      [xml]$headXml = Get-Content $proj
      $version = $headXml.Project.PropertyGroup.Version | Select-Object -First 1

      if ([string]::IsNullOrWhiteSpace($version)) {
        throw "Version not found"
      }

      $tag = "v$version"

      Write-Host "##vso[task.setvariable variable=VERSION]$version"
      Write-Host "##vso[task.setvariable variable=RELEASE_TAG]$tag"

# ------------------------------------------------------------
# 3. Setup .NET
# ------------------------------------------------------------
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 10.0.x

# ------------------------------------------------------------
# 4. Restore / Build / Publish
# ------------------------------------------------------------
- script: |
    dotnet restore src/EdgeBrowsingPower/EdgeBrowsingPower.csproj -r $(RUNTIME_IDENTIFIER)
  displayName: Restore

- script: |
    dotnet build src/EdgeBrowsingPower/EdgeBrowsingPower.csproj -c $(CONFIGURATION) -r $(RUNTIME_IDENTIFIER) --self-contained true --no-restore
  displayName: Build

- script: |
    dotnet publish src/EdgeBrowsingPower/EdgeBrowsingPower.csproj -c $(CONFIGURATION) -r $(RUNTIME_IDENTIFIER) --self-contained true -o $(PUBLISH_DIR) --no-build
  displayName: Publish

# ------------------------------------------------------------
# 5. Sign EXE / DLL
# ------------------------------------------------------------
- task: onebranch.pipeline.signing@1
  displayName: Sign binaries
  inputs:
    command: sign
    signing_profile: external_distribution
    files_to_sign: |
      EdgeBrowsingPower.exe;EdgeBrowsingPower.dll
    search_root: $(PUBLISH_DIR)

# ------------------------------------------------------------
# 6. Build MSI
# ------------------------------------------------------------
- script: |
    dotnet build installer/EdgeBrowsingPower.Installer/EdgeBrowsingPower.Installer.wixproj -c $(CONFIGURATION)
  displayName: Build MSI

# ------------------------------------------------------------
# 7. Sign MSI
# ------------------------------------------------------------
- task: onebranch.pipeline.signing@1
  displayName: Sign MSI
  inputs:
    command: sign
    signing_profile: external_distribution
    files_to_sign: |
      EdgeBrowsingPower-$(VERSION)-$(RUNTIME_IDENTIFIER).msi
    search_root: $(INSTALLER_DIR)

# ------------------------------------------------------------
# 8. Verify signature
# ------------------------------------------------------------
- task: PowerShell@2
  displayName: Verify signatures
  inputs:
    targetType: inline
    script: |
      $files = @(
        "$(PUBLISH_DIR)\EdgeBrowsingPower.exe",
        "$(PUBLISH_DIR)\EdgeBrowsingPower.dll",
        "$(INSTALLER_DIR)\EdgeBrowsingPower-$(VERSION)-$(RUNTIME_IDENTIFIER).msi"
      )

      foreach ($f in $files) {
        $sig = Get-AuthenticodeSignature $f
        if ($sig.Status -ne "Valid") {
          throw "Invalid signature: $f"
        }
        Write-Host "Signed: $f"
      }

# ------------------------------------------------------------
# 9. Package
# ------------------------------------------------------------
- task: PowerShell@2
  displayName: Package release
  inputs:
    targetType: inline
    script: |
      $releaseDir = "$(Build.ArtifactStagingDirectory)\release\$(VERSION)"
      New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

      $zip = "EdgeBrowsingPower-$(VERSION).zip"
      Compress-Archive -Path "$(PUBLISH_DIR)\*" -DestinationPath "$releaseDir\$zip"

      Copy-Item "$(INSTALLER_DIR)\EdgeBrowsingPower-$(VERSION)-$(RUNTIME_IDENTIFIER).msi" $releaseDir

      Write-Host "##vso[task.setvariable variable=ZIP]$releaseDir\$zip"
      Write-Host "##vso[task.setvariable variable=MSI]$releaseDir\EdgeBrowsingPower-$(VERSION)-$(RUNTIME_IDENTIFIER).msi"

# ------------------------------------------------------------
# 10. Publish artifact
# ------------------------------------------------------------
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: $(Build.ArtifactStagingDirectory)
    artifact: release

# ------------------------------------------------------------
# 11. Create GitHub Release (optional)
# ------------------------------------------------------------
- task: PowerShell@2
  displayName: Create GitHub Release
  condition: ne(variables['GITHUB_RELEASE_PAT'], '')
  env:
    GITHUB_TOKEN: $(GITHUB_RELEASE_PAT)
  inputs:
    targetType: inline
    script: |
      $repo = "microsoft/WebBrowsingPowerRelease"
      $tag = "$(RELEASE_TAG)"

      $headers = @{
        Authorization = "Bearer $env:GITHUB_TOKEN"
        Accept = "application/vnd.github+json"
      }

      $body = @{
        tag_name = $tag
        name = "EdgeBrowsingPower $tag"
      } | ConvertTo-Json

      $release = Invoke-RestMethod `
        -Uri "https://api.github.com/repos/$repo/releases" `
        -Headers $headers `
        -Method POST `
        -Body $body

      $upload = $release.upload_url -replace "{.*}", ""

      Invoke-RestMethod -Uri "$upload?name=app.zip" -Headers $headers -Method POST -InFile "$(ZIP)"
      Invoke-RestMethod -Uri "$upload?name=installer.msi" -Headers $headers -Method POST -InFile "$(MSI)"