name: EdgeBrowsingPower_Release_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr: none

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

variables:
  CONFIGURATION: Release
  RUNTIME_IDENTIFIER: win-x64
  PUBLISH_DIR: artifacts\EdgeBrowsingPower\win-x64
  INSTALLER_DIR: artifacts\EdgeBrowsingPower\installer
  ENABLE_PRS_DELAYSIGN: 1
  ROOT: $(Build.SourcesDirectory)
  REPOROOT: $(Build.SourcesDirectory)
  OUTPUTROOT: $(Build.SourcesDirectory)\out
  WindowsContainerImage: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    featureFlags:
      WindowsHostVersion: '1ESWindows2022'
    release:
      category: NonAzure
    stages:
      - stage: Build_Sign_Release
        displayName: Build, sign, and release
        jobs:
          - job: main
            displayName: Build and sign EdgeBrowsingPower
            pool:
              type: windows
            variables:
              ob_outputDirectory: $(Build.ArtifactStagingDirectory)\release
              ob_artifactBaseName: release
              ob_sdl_codeSignValidation_excludes: ''
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1

              - task: PowerShell@2
                name: setVersion
                displayName: Detect version and tag
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $proj = "$(Build.SourcesDirectory)\src\EdgeBrowsingPower\EdgeBrowsingPower.csproj"
                    if (!(Test-Path $proj)) {
                      throw "Project file not found: $proj"
                    }

                    [xml]$headXml = Get-Content $proj
                    $version = $headXml.Project.PropertyGroup.Version | Select-Object -First 1
                    if ([string]::IsNullOrWhiteSpace($version)) {
                      throw "Project version was not found in $proj."
                    }

                    $baseTag = "v$version"
                    $remoteTags = @(
                      git ls-remote --tags origin "refs/tags/$baseTag*" |
                        ForEach-Object {
                          if ($_ -match "refs/tags/(.+?)(\^\{\})?$") {
                            $matches[1]
                          }
                        } |
                        Sort-Object -Unique
                    )

                    if ($remoteTags -notcontains $baseTag) {
                      $releaseTag = $baseTag
                    }
                    else {
                      $suffix = 1
                      do {
                        $releaseTag = "$baseTag-$suffix"
                        $suffix++
                      } while ($remoteTags -contains $releaseTag)
                    }

                    Write-Host "Version: $version"
                    Write-Host "Release tag: $releaseTag"
                    Write-Host "##vso[task.setvariable variable=VERSION]$version"
                    Write-Host "##vso[task.setvariable variable=RELEASE_TAG]$releaseTag"

              - task: UseDotNet@2
                displayName: Setup .NET 10 SDK
                inputs:
                  packageType: sdk
                  version: 10.0.x

              - task: PowerShell@2
                displayName: Restore EdgeBrowsingPower
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    dotnet restore "$(Build.SourcesDirectory)\src\EdgeBrowsingPower\EdgeBrowsingPower.csproj" `
                      -r "$(RUNTIME_IDENTIFIER)"

              - task: PowerShell@2
                displayName: Build EdgeBrowsingPower
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    dotnet build "$(Build.SourcesDirectory)\src\EdgeBrowsingPower\EdgeBrowsingPower.csproj" `
                      -c "$(CONFIGURATION)" `
                      -r "$(RUNTIME_IDENTIFIER)" `
                      --self-contained true `
                      --no-restore

              - task: PowerShell@2
                displayName: Publish EdgeBrowsingPower
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $publishDir = "$(Build.SourcesDirectory)\$(PUBLISH_DIR)"
                    New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

                    dotnet publish "$(Build.SourcesDirectory)\src\EdgeBrowsingPower\EdgeBrowsingPower.csproj" `
                      -c "$(CONFIGURATION)" `
                      -r "$(RUNTIME_IDENTIFIER)" `
                      --self-contained true `
                      -o $publishDir `
                      --no-build

              - task: onebranch.pipeline.signing@1
                displayName: Sign binaries
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  files_to_sign: |
                    EdgeBrowsingPower.exe;EdgeBrowsingPower.dll
                  search_root: $(Build.SourcesDirectory)\$(PUBLISH_DIR)

              - task: PowerShell@2
                displayName: Build MSI
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    dotnet build "$(Build.SourcesDirectory)\installer\EdgeBrowsingPower.Installer\EdgeBrowsingPower.Installer.wixproj" `
                      -c "$(CONFIGURATION)" `
                      -p:SuppressValidation=true

              - task: onebranch.pipeline.signing@1
                displayName: Sign MSI
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  files_to_sign: |
                    EdgeBrowsingPower-$(VERSION).msi
                  search_root: $(Build.SourcesDirectory)\$(INSTALLER_DIR)

              - task: PowerShell@2
                displayName: Verify signatures
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $files = @(
                      "$(Build.SourcesDirectory)\$(PUBLISH_DIR)\EdgeBrowsingPower.exe",
                      "$(Build.SourcesDirectory)\$(PUBLISH_DIR)\EdgeBrowsingPower.dll",
                      "$(Build.SourcesDirectory)\$(INSTALLER_DIR)\EdgeBrowsingPower-$(VERSION).msi"
                    )

                    foreach ($file in $files) {
                      if (!(Test-Path $file)) {
                        throw "Expected signed file not found: $file"
                      }

                      $signature = Get-AuthenticodeSignature -FilePath $file
                      if ($signature.Status -ne "Valid") {
                        throw "Invalid code signature for $file : $($signature.Status) $($signature.StatusMessage)"
                      }

                      Write-Host "Valid code signature: $file"
                    }

              - task: PowerShell@2
                displayName: Package release
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    $version = "$(VERSION)"
                    $releaseDir = "$(Build.ArtifactStagingDirectory)\release\$version"
                    $zipName = "EdgeBrowsingPower-$version.zip"
                    $msiName = "EdgeBrowsingPower-$version.msi"
                    New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

                    Compress-Archive `
                      -Path "$(Build.SourcesDirectory)\$(PUBLISH_DIR)\*" `
                      -DestinationPath "$releaseDir\$zipName" `
                      -Force

                    Copy-Item `
                      -Path "$(Build.SourcesDirectory)\$(INSTALLER_DIR)\$msiName" `
                      -Destination "$releaseDir\$msiName" `
                      -Force

                    Write-Host "##vso[task.setvariable variable=ZIP]$releaseDir\$zipName"
                    Write-Host "##vso[task.setvariable variable=MSI]$releaseDir\$msiName"

              - task: PublishPipelineArtifact@1
                displayName: Publish release artifact
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)\release\$(VERSION)
                  artifact: release-$(RELEASE_TAG)
                  publishLocation: pipeline

              - task: PowerShell@2
                displayName: Create GitHub Release
                condition: and(succeeded(), ne(variables['GITHUB_RELEASE_PAT'], ''))
                env:
                  GITHUB_TOKEN: $(GITHUB_RELEASE_PAT)
                inputs:
                  targetType: inline
                  pwsh: true
                  script: |
                    if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
                      Write-Host "GITHUB_RELEASE_PAT is not set. Skipping GitHub Release creation."
                      exit 0
                    }

                    $repo = "microsoft/WebBrowsingPowerRelease"
                    $tag = "$(RELEASE_TAG)"
                    $headers = @{
                      Authorization = "Bearer $env:GITHUB_TOKEN"
                      Accept = "application/vnd.github+json"
                      "X-GitHub-Api-Version" = "2022-11-28"
                    }

                    $body = @{
                      tag_name = $tag
                      name = "EdgeBrowsingPower $tag"
                      generate_release_notes = $true
                    } | ConvertTo-Json -Depth 10

                    try {
                      $release = Invoke-RestMethod `
                        -Uri "https://api.github.com/repos/$repo/releases" `
                        -Headers $headers `
                        -Method POST `
                        -Body $body `
                        -ContentType "application/json"
                    }
                    catch {
                      $errorText = $_.ErrorDetails.Message
                      if ($errorText -match "already_exists" -or $_.Exception.Message -match "422") {
                        $release = Invoke-RestMethod `
                          -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" `
                          -Headers $headers `
                          -Method GET
                      }
                      else {
                        throw
                      }
                    }

                    function Upload-GitHubReleaseAsset {
                      param(
                        [Parameter(Mandatory = $true)][string]$UploadUrl,
                        [Parameter(Mandatory = $true)][string]$FilePath
                      )

                      $fileName = [System.IO.Path]::GetFileName($FilePath)
                      $uploadUri = ($UploadUrl -replace "\{.*\}", "") + "?name=$fileName"

                      Invoke-RestMethod `
                        -Uri $uploadUri `
                        -Headers $headers `
                        -Method POST `
                        -ContentType "application/octet-stream" `
                        -InFile $FilePath | Out-Null
                    }

                    Upload-GitHubReleaseAsset -UploadUrl $release.upload_url -FilePath "$(ZIP)"
                    Upload-GitHubReleaseAsset -UploadUrl $release.upload_url -FilePath "$(MSI)"
