name: Build and Release on Version Change

on:
  push:
    branches: [ main, olivia/test-release-work ]
    # Optional: only run when likely version files change
    paths:
      - .github/workflows/build-and-release.yml
      - src/EdgeBrowsingPower/EdgeBrowsingPower.csproj
      - src/**
      - installer/**
      - manifests/**
  workflow_dispatch:
permissions:
  contents: write

jobs:
  detect-version:
    runs-on: windows-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      release_folder_exists: ${{ steps.check.outputs.release_folder_exists }}
      release_tag_exists: ${{ steps.check.outputs.release_tag_exists }}
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version changed
        id: check
        shell: pwsh
        run: |
          $proj = "src/EdgeBrowsingPower/EdgeBrowsingPower.csproj"

          # Current version from HEAD
          [xml]$headXml = Get-Content $proj
          $headVersion = $headXml.Project.PropertyGroup.Version | Select-Object -First 1

          # Previous commit version (if available)
          $hasPrev = $true
          try {
            git show HEAD~1:$proj > $env:RUNNER_TEMP\prev.csproj
          } catch {
            $hasPrev = $false
          }

          if (-not $hasPrev) {
            # First run: treat as changed
            $versionChanged = $true
          } else {
            [xml]$prevXml = Get-Content $env:RUNNER_TEMP\prev.csproj
            $prevVersion = $prevXml.Project.PropertyGroup.Version | Select-Object -First 1

            $versionChanged = $false
            if ($headVersion -and $headVersion -ne $prevVersion) {
              $versionChanged = $true
            }
          }

          # Build whenever the versioned release folder does not already exist in the runner workspace.
          $releaseDir = "out/release/$headVersion"
          $releaseFolderExists = Test-Path $releaseDir

          # Check if a GitHub release tag already exists for this version.
          $tagName = "v$headVersion"
          $tagRef = git ls-remote --tags origin "refs/tags/$tagName"
          $releaseTagExists = -not [string]::IsNullOrWhiteSpace($tagRef)

          # Build/release if the versioned release folder is missing in the runner workspace.
          $shouldBuild = -not $releaseFolderExists

          if ($versionChanged) {
            "version_changed=true" >> $env:GITHUB_OUTPUT
          } else {
            "version_changed=false" >> $env:GITHUB_OUTPUT
          }

          if ($releaseFolderExists) {
            "release_folder_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "release_folder_exists=false" >> $env:GITHUB_OUTPUT
          }

          if ($releaseTagExists) {
            "release_tag_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "release_tag_exists=false" >> $env:GITHUB_OUTPUT
          }

          if ($shouldBuild) {
            "should_build=true" >> $env:GITHUB_OUTPUT
          } else {
            "should_build=false" >> $env:GITHUB_OUTPUT
          }

          "version=$headVersion" >> $env:GITHUB_OUTPUT

  build-and-release:
    needs: detect-version
    if: needs.detect-version.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/EdgeBrowsingPower/EdgeBrowsingPower.csproj

      - name: Build
        run: dotnet build src/EdgeBrowsingPower/EdgeBrowsingPower.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/EdgeBrowsingPower/EdgeBrowsingPower.csproj -c Release -o out/publish --no-build

      - name: Create versioned release folder
        shell: pwsh
        run: |
          $version = "${{ needs.detect-version.outputs.version }}"
          $releaseDir = "out/release/$version"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $zipName = "EdgeBrowsingPower-$version.zip"
          Compress-Archive -Path "out/publish/*" -DestinationPath "$releaseDir/$zipName" -Force

          "RELEASE_DIR=$releaseDir" >> $env:GITHUB_ENV
          "ZIP_PATH=$releaseDir/$zipName" >> $env:GITHUB_ENV

      - name: Upload build artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.detect-version.outputs.version }}
          path: ${{ env.RELEASE_DIR }}

      - name: Create GitHub Release and upload package
        if: needs.detect-version.outputs.release_tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: EdgeBrowsingPower v${{ needs.detect-version.outputs.version }}
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true